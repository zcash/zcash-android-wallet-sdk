name: 'Setup Java, Rust, and Dependency Cache'
description: "Configures the build environment and caches Gradle, dependencies, and build outputs."
runs:
  using: "composite"
  steps:
    - name: Set Env
      shell: bash
      run: |
        echo "home=${HOME}" >> "$GITHUB_ENV"
    - name: Set up Java
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Setup Android NDK
      shell: bash
      run: |
        ANDROID_ROOT=/usr/local/lib/android
        ANDROID_SDK_ROOT=${ANDROID_ROOT}/sdk
        SDKMANAGER=${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager
        echo "y" | $SDKMANAGER "ndk;27.0.12077973"
    - name: Setup Rust
      shell: bash
      # Use the channel pinned in rust-toolchain.toml (the single source of truth) rather than a
      # hardcoded version. rustup honors the toolchain file in-repo regardless, so a hardcoded
      # version here installs components onto a toolchain the build never runs: that is why
      # `cargo clippy` failed with "'cargo-clippy' is not installed for the toolchain 1.92.0"
      # while clippy had been installed for 1.84.1.
      run: |
        # `sed` rather than `grep -oP`: -P is a GNU extension, and this composite action
        # should keep working if it is ever reused from a macOS/BSD runner.
        CHANNEL="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
        rustup toolchain install "${CHANNEL}"
        rustup default "${CHANNEL}"
        rustup target add --toolchain "${CHANNEL}" armv7-linux-androideabi aarch64-linux-android i686-linux-android x86_64-linux-android
        rustup component add --toolchain "${CHANNEL}" clippy rustfmt
    - name: Configure Gradle
      shell: bash
      run: |
        mkdir ~/.gradle
        echo -n > ~/.gradle/gradle.properties
    - name: Gradle Binary Cache Restore
      id: gradle-binary-cache-restore
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "3"
      with:
        path: |
          ~/.gradle/notifications
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-binary-${{ hashFiles(format('{0}{1}', github.workspace, '/gradle/wrapper/gradle-wrapper.properties')) }}
    - name: Gradle Dependency Cache Restore
      id: gradle-dependency-cache-restore
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "3"
      with:
        path: |
          ~/.gradle/caches/modules-2
        key: ${{ runner.os }}-gradle-deps-${{ hashFiles(format('{0}{1}', github.workspace, '/gradle.properties')) }}
        restore-keys: |
          ${{ runner.os }}-gradle-deps-
    - name: Gradle Build Cache Restore
      id: gradle-build-cache-restore
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "3"
      with:
        path: |
          ~/.gradle/caches/build-cache-1
          ~/.gradle/caches/transforms-3
          .gradle/configuration-cache
        key: ${{ runner.os }}-gradle-build-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-gradle-build-
    - name: Rust Cache Restore
      id: rust-cache-restore
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "3"
      with:
        # The crate lives in backend-lib/; it moved there from sdk-lib/ in
        # "[#971] Refactor Rust FFI to separate module" and this cache was left
        # behind. `sdk-lib/target` has not existed since, so no compiled artifact
        # was ever cached and every job paid a full cold build of the dependency
        # tree (arti included). Only ~/.cargo, the download registry, was working.
        path: |
          backend-lib/target
          ~/.cargo
        # Cargo.lock pins the dependency versions, Cargo.toml the feature
        # selection, build.gradle.kts the target ABIs and profile, and
        # rust-toolchain.toml the compiler -- a change to any of them invalidates
        # compiled output. The old key hashed two files that do not exist, so it
        # never changed when dependencies did.
        key: ${{ runner.os }}-rust-${{ hashFiles(format('{0}{1}', github.workspace, '/backend-lib/Cargo.lock'), format('{0}{1}', github.workspace, '/backend-lib/Cargo.toml'), format('{0}{1}', github.workspace, '/backend-lib/build.gradle.kts'), format('{0}{1}', github.workspace, '/rust-toolchain.toml')) }}
        # Without a prefix fallback an exact-key miss is a fully cold build, so
        # every Cargo.lock bump would recompile everything. A stale hit still
        # leaves most of the dependency tree reusable.
        restore-keys: |
          ${{ runner.os }}-rust-

    - name: Gradle Binary Download
      if: steps.gradle-binary-cache-restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        ./gradlew --version
    - name: Gradle Dependency Download
      if: steps.gradle-dependency-cache-restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        ./gradlew dependencies :sdk-lib:dependencies :demo-app:dependencies
    - name: Gradle Build
      if: github.event.pull_request.head.sha == '' && (steps.gradle-binary-cache-restore.outputs.cache-hit != 'true' || steps.gradle-dependency-cache-restore.outputs.cache-hit != 'true' || steps.rust-cache-restore.outputs.cache-hit != 'true' || steps.gradle-build-cache-restore.outputs.cache-hit != 'true')
      env:
        ORG_GRADLE_PROJECT_IS_MINIFY_APP_ENABLED: "false"
      shell: bash
      run: |
        ./gradlew assemble assembleAndroidTest

    - name: Gradle Binary Cache Save
      id: gradle-binary-cache-save
      if: github.event.pull_request.head.sha == '' && steps.gradle-binary-cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "3"
      with:
        path: |
          ~/.gradle/notifications
          ~/.gradle/wrapper
        key: steps.gradle-binary-cache-restore.key
    - name: Gradle Dependency Cache Save
      id: gradle-dependency-cache-save
      if: github.event.pull_request.head.sha == '' && steps.gradle-dependency-cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
      with:
        path: |
          ~/.gradle/caches/modules-2
        key: ${{ steps.gradle-dependency-cache-restore.key }}
    - name: Rust Cache Save
      id: rust-cache-save
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "3"
      with:
        path: |
          backend-lib/target
          ~/.cargo
        key: ${{ steps.rust-cache-restore.key }}
