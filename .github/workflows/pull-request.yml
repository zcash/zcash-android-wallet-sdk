  # Runs the Android instrumentation suites on a Gradle Managed Device: a
  # hardware-accelerated emulator booted inside the runner. This replaces the
  # former emulator.wtf cloud job and depends on no external test service.
  test_android_modules_emulator:
    needs: [validate_gradle_wrapper]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # ubuntu-latest exposes /dev/kvm, but the default udev rules do not grant
      # the runner user access to it. This rule opens it so the managed-device
      # emulator can use KVM acceleration instead of falling back to software.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Setup
        id: setup
        timeout-minutes: 30
        uses: ./.github/actions/setup
        with:
          rust-cache: true
      # The hosted runner's Android SDK does not include the emulator package,
      # which a Gradle Managed Device requires. AGP auto-installs the system
      # image but not the emulator, so without this the pixel2MinSetup task
      # fails at VersionedSdkLoader.getEmulatorDirectoryProvider().get() with
      # "Cannot query the value of this property because it has no value
      # available". Install it explicitly.
      - name: Install Android emulator
        timeout-minutes: 5
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "emulator"
      # pixel2Min is the Gradle Managed Device defined in
      # zcash-sdk.android-conventions.gradle.kts (Pixel 2, API ANDROID_MIN_SDK_VERSION).
      # Scoped to the same four modules the former emulator.wtf job covered;
      # the unqualified task would also pull in darkside-test-lib (needs a live
      # darkside server) and the demo-app modules. maxConcurrentDevices=1 keeps a
      # single emulator booted at a time so the runner is not overwhelmed by four
      # parallel emulators; in-runner emulators run serially, hence the higher
      # timeout than the former cloud job.
      # emulator.gpu=swiftshader_indirect forces software rendering. The hosted
      # runner is headless, and AGP's default '-gpu auto-no-window' intermittently
      # falls back to 'auto', which needs a real GPU and fails to boot the
      # emulator (EmulatorStartFailedException during snapshot creation).
      - name: Build and test
        timeout-minutes: 45
        run: |
          make test-instrumented
      - name: Collect Artifacts
        if: ${{ always() }}
        timeout-minutes: 1
        env:
          ARTIFACTS_DIR_PATH: ${{ format('{0}/artifacts', env.home) }}
          TEST_RESULTS_ZIP_PATH: ${{ format('{0}/artifacts/test_results.zip', env.home) }}
        run: |
          mkdir ${ARTIFACTS_DIR_PATH}

          # Managed-device runs write results/reports under build/outputs and
          # build/reports/androidTests, not build/test-results, so include those
          # too to make failures inspectable from the artifact.
          zip -r ${TEST_RESULTS_ZIP_PATH} . \
            -i \*/build/test-results/\* \
            \*/build/outputs/androidTest-results/\* \
            \*/build/reports/androidTests/\*
      - name: Upload Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 1
        with:
          name: Test Android modules with emulator results
          path: ~/artifacts

  demo_app_release_build:
    needs: validate_gradle_wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Setup
        id: setup
        timeout-minutes: 30
        uses: ./.github/actions/setup
        with:
          rust-cache: true
      # A fake signing key to satisfy creating a "release" build
      - name: Export Signing Key
        env:
          SIGNING_KEY_PATH: ${{ format('{0}/release.jks', env.home) }}
        shell: bash
        run: |
          keytool -genkey -v -keystore $SIGNING_KEY_PATH -keypass android -storepass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 100000 -dname "CN=, OU=, O=Test, L=, S=, C=" -noprompt
      - name: Build
        timeout-minutes: 45
        env:
          ORG_GRADLE_PROJECT_ZCASH_RELEASE_KEYSTORE_PATH: ${{ format('{0}/release.jks', env.home) }}
          ORG_GRADLE_PROJECT_ZCASH_RELEASE_KEYSTORE_PASSWORD: android
          ORG_GRADLE_PROJECT_ZCASH_RELEASE_KEY_ALIAS: androiddebugkey
          ORG_GRADLE_PROJECT_ZCASH_RELEASE_KEY_ALIAS_PASSWORD: android
        run: |
           make build-release
      - name: Collect Artifacts
        timeout-minutes: 1
        env:
          ARTIFACTS_DIR_PATH: ${{ format('{0}/artifacts', env.home) }}
          BINARIES_ZIP_PATH: ${{ format('{0}/artifacts/binaries.zip', env.home) }}
          MAPPINGS_ZIP_PATH: ${{ format('{0}/artifacts/mappings.zip', env.home) }}
        run: |
          mkdir ${ARTIFACTS_DIR_PATH}
          zip -r ${BINARIES_ZIP_PATH} . -i demo-app/build/outputs/apk/\*/release/\*.apk demo-app/build/outputs/bundle/\*/release/\*.aab
          zip -r ${MAPPINGS_ZIP_PATH} . -i demo-app/build/outputs/mapping/\*/mapping.txt
      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 1
        with:
          name: Demo app release binaries
          path: ~/artifacts

  # Performs a button mash test on the release build of the demo app
  test_robo_demo_app:
    # Turning off until the issue of authentication is resolved
    # TODO [#1326]: Broken authentication with Flank on CI tests
    # TODO [#1326]: https://github.com/Electric-Coin-Company/zcash-android-wallet-sdk/issues/1326
    if: false # needs.check_firebase_secrets.outputs.has-secrets == 'true'
    needs: [demo_app_release_build, check_firebase_secrets]
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
      id-token: write
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Setup
        id: setup
        timeout-minutes: 30
        uses: ./.github/actions/setup
      - name: Authenticate to Google Cloud for Firebase Test Lab
        id: auth_test_lab
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          create_credentials_file: true
          project_id: ${{ vars.FIREBASE_TEST_LAB_PROJECT }}
          service_account: ${{ secrets.FIREBASE_TEST_LAB_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.FIREBASE_TEST_LAB_WORKLOAD_IDENTITY_PROVIDER }}
          access_token_lifetime: '900s'
      - name: Download a single artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Demo app release binaries
      - name: Robo test
        timeout-minutes: 20
        env:
          # Path depends on `release_build` job, plus path of `Download a single artifact` step
          BINARIES_ZIP_PATH: binaries.zip
          # This first environment variable is used by Flank, since the temporary token is missing the project name
          GOOGLE_CLOUD_PROJECT: ${{ vars.FIREBASE_TEST_LAB_PROJECT }}
          ORG_GRADLE_PROJECT_ZCASH_FIREBASE_TEST_LAB_API_KEY_PATH: ${{ steps.auth_test_lab.outputs.credentials_file_path }}
        run: |
          unzip ${BINARIES_ZIP_PATH}
          make test-robo
