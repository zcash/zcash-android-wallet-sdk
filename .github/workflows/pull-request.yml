# Expected secrets
# FIREBASE_TEST_LAB_SERVICE_ACCOUNT - Email address of Firebase Test Lab service account
# FIREBASE_TEST_LAB_WORKLOAD_IDENTITY_PROVIDER - Workload identity provider to generate temporary service account key

# Expected variables
# FIREBASE_TEST_LAB_PROJECT - Firebase Test Lab project name

name: Pull Request

on:
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'LICENSE'
      - 'README.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_gradle_wrapper:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Gradle Wrapper Validation
        timeout-minutes: 1
        uses: gradle/actions/wrapper-validation@v6

  check_firebase_secrets:
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.check_firebase_secrets.outputs.defined }}
    steps:
      - id: check_firebase_secrets
        env:
          FIREBASE_TEST_LAB_PROJECT: ${{ vars.FIREBASE_TEST_LAB_PROJECT }}
          FIREBASE_TEST_LAB_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_TEST_LAB_SERVICE_ACCOUNT }}
          FIREBASE_TEST_LAB_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.FIREBASE_TEST_LAB_WORKLOAD_IDENTITY_PROVIDER }}
        if: "${{ env.FIREBASE_TEST_LAB_PROJECT != '' && env.FIREBASE_TEST_LAB_SERVICE_ACCOUNT != '' && env.FIREBASE_TEST_LAB_WORKLOAD_IDENTITY_PROVIDER != '' }}"
        run: echo "defined=true" >> $GITHUB_OUTPUT

  check_properties:
    needs: validate_gradle_wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Setup
        id: setup
        timeout-minutes: 10
        uses: ./.github/actions/setup
      - name: Check properties
        timeout-minutes: 4
        run: |
          make check-properties

  static_analysis_detekt:
    needs: validate_gradle_wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Setup
        id: setup
        timeout-minutes: 30
        uses: ./.github/actions/setup
      - name: Detekt
        timeout-minutes: 4
        run: |
          make detekt
      - name: Collect Artifacts
        timeout-minutes: 1
        if: ${{ always() }}
        env:
          ARTIFACTS_DIR_PATH: ${{ format('{0}/artifacts', env.home) }}
          REPORTS_ZIP_PATH: ${{ format('{0}/artifacts/static_analysis_detekt.zip', env.home) }}
        run: |
          mkdir ${ARTIFACTS_DIR_PATH}

          zip -r ${REPORTS_ZIP_PATH} . -i build/reports/detekt/\*
      - name: Upload Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 1
        with:
          name: Detekt static analysis results
          path: ~/artifacts

  static_analysis_ktlint:
    needs: validate_gradle_wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Setup
        id: setup
        timeout-minutes: 30
        uses: ./.github/actions/setup
      - name: Ktlint
        timeout-minutes: 4
        run: |
          make ktlint
      - name: Collect Artifacts
        timeout-minutes: 1
        if: ${{ always() }}
        env:
          ARTIFACTS_DIR_PATH: ${{ format('{0}/artifacts', env.home) }}
          REPORTS_ZIP_PATH: ${{ format('{0}/artifacts/static_analysis_ktlint.zip', env.home) }}
        run: |
          mkdir ${ARTIFACTS_DIR_PATH}

          zip -r ${REPORTS_ZIP_PATH} . -i build/reports/ktlint/\*
      - name: Upload Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 1
        with:
          name: Ktlint static analysis results
          path: ~/artifacts

  static_analysis_android_lint:
    needs: validate_gradle_wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Setup
        id: setup
        timeout-minutes: 30
        uses: ./.github/actions/setup
        with:
          rust-cache: true
      - name: Android Lint
        timeout-minutes: 25
        env:
          # Disable minify, since it makes lint run faster
          ORG_GRADLE_PROJECT_IS_MINIFY_APP_ENABLED: false
        run: |
          make lint-android
      - name: Collect Artifacts
        if: ${{ always() }}
        timeout-minutes: 1
        env:
          ARTIFACTS_DIR_PATH: ${{ format('{0}/artifacts', env.home) }}
          LINT_ZIP_PATH: ${{ format('{0}/artifacts/android_lint.zip', env.home) }}
        run: |
          mkdir ${ARTIFACTS_DIR_PATH}
          zip -r ${LINT_ZIP_PATH} . -i \*build/reports/\*
      - name: Upload Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 1
        with:
          name: Android Lint static analysis results
          path: ~/artifacts

  # Runs the Rust unit tests. static_analysis_clippy compiles them via --tests but never
  # executes them, so without this a failing test can sit unnoticed indefinitely.
  test_rust_unit:
    needs: validate_gradle_wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Setup
        id: setup
        timeout-minutes: 30
        uses: ./.github/actions/setup
        with:
          rust-cache: true
      - name: Test
        timeout-minutes: 15
        run: |
          make test-rust

  # --all-features matters: code behind a cargo feature (for example the
  # android-test-fixtures gate the Android build enables) is invisible to a
  # default-feature check, so a merge can break it while `cargo check` stays green.
  # --tests extends the same coverage to test-only code.
  static_analysis_clippy:
    needs: validate_gradle_wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Setup
        id: setup
        timeout-minutes: 30
        uses: ./.github/actions/setup
        with:
          rust-cache: true
      - name: Clippy
        timeout-minutes: 15
        run: |
          make lint-rust

  # Checks that the Rust sources are rustfmt-clean. `--check` only reports; it never
  # rewrites the tree, so this job cannot mask an unformatted commit by fixing it.
  #
  # There is no rustfmt.toml, so this is stock rustfmt defaults for the edition in
  # backend-lib/Cargo.toml. Run `cargo fmt --all` in backend-lib/ to fix a failure.
  static_analysis_rustfmt:
    needs: validate_gradle_wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Setup
        id: setup
        timeout-minutes: 30
        uses: ./.github/actions/setup
      - name: Rustfmt
        timeout-minutes: 5
        run: |
          make check-format-rust

  # backend-lib/src/main/proto/proposal.proto is vendored from librustzcash.
  # Rust encodes proposals with the schema of the pinned zcash_client_backend,
  # so a stale copy silently drops fields on the Kotlin side. Re-derive it from
  # the pinned version and fail if the committed copy differs.
  check_proposal_proto:
    needs: validate_gradle_wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Check proposal.proto matches the pinned zcash_client_backend
        timeout-minutes: 5
        run: |
          ./scripts/update-proposal-proto.sh --check

  test_android_modules_unit:
    needs: [ validate_gradle_wrapper ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Setup
        id: setup
        timeout-minutes: 30
        uses: ./.github/actions/setup
        with:
          rust-cache: true
      - name: Build and test
        timeout-minutes: 30
        run: |
          make test-unit
      - name: Collect Artifacts
        if: ${{ always() }}
        timeout-minutes: 1
        env:
          ARTIFACTS_DIR_PATH: ${{ format('{0}/artifacts', env.home) }}
          TEST_RESULTS_ZIP_PATH: ${{ format('{0}/artifacts/test_results.zip', env.home) }}
        run: |
          mkdir ${ARTIFACTS_DIR_PATH}

          zip -r ${TEST_RESULTS_ZIP_PATH} . -i \*/build/test-results/\* \*/build/reports/\*
      - name: Upload Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 1
        with:
          name: Test Android modules with Unit Tests
          path: ~/artifacts

  # DISABLED pending a decision with the Android devs -- do not delete yet.
  #
  # This job ran the module instrumentation suites on Firebase Test Lab. It had in
  # fact been dormant for a long time: its condition compared
  # `check_emulator_wtf_secrets.outputs.has-secrets` against the string 'false',
  # but with no EMULATOR_WTF_API_KEY configured that output is the empty string, so
  # the condition was never true and the job skipped on every run. Removing that
  # dead gate let it run again, whereupon its Build step timed out at 20 minutes
  # still compiling Rust dependencies (hence the 30 below, matching the sibling
  # emulator job's budget for the same assemble work).
  #
  # The open question is whether it is worth restoring at all:
  # test_android_modules_emulator now covers the same four modules on an in-runner
  # Gradle Managed Device, and was added specifically to replace a cloud test
  # service. Running both means paying Firebase Test Lab and roughly half an hour
  # of CI for duplicate coverage -- against which FTL does test on real hardware,
  # which the emulator does not.
