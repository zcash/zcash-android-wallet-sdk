[package]
name = "zcash-android-wallet-sdk"
version = "2.8.0-rc.2"
authors = [
    "Jack Grigg <jack@z.cash>",
    "Kevin Gorham <kevin.gorham@z.cash>",
]
description = "JNI backend for the Android wallet SDK"
publish = false
edition = "2024"
rust-version = "1.92"

[features]
# Enables JNI helpers that are only used by Android instrumentation tests.
# This feature must not be enabled for production native builds.
android-test-fixtures = []

[dependencies]
# Zcash dependencies
orchard = { version = "0.15", features = ["unstable-voting-circuits"] }
pczt = { version = "0.9.0", features = ["prover", "orchard", "sapling"] }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }
transparent = { package = "zcash_transparent", version = "0.10", default-features = false }
zcash_address = "0.13"
zcash_client_backend = { version = "0.24.0-rc.6", features = [
    "orchard",
    "lightwalletd-tonic-tls-webpki-roots",
    "tor",
    "transparent-inputs",
    "unstable",
    "pczt",
] }
zcash_client_sqlite = { version = "0.22.0-rc.6", features = ["orchard", "transparent-inputs", "unstable", "serde"] }
zcash_note_encryption = "0.4.1"
zcash_primitives = "0.30"
zcash_proofs = "0.30"
zcash_protocol = "0.10"
zcash_script = "0.4"
zip32 = "0.2"
eip681 = "0.1.0"
# Used by voting/notes.rs to construct historical Orchard witness positions, and
# by nothing else -- commented out with the voting module it serves.
incrementalmerkletree = { version = "0.8", default-features = false }

# Infrastructure
prost = "0.14"
rusqlite = "0.37"
secrecy = "0.8"
rand = "0.8"
nonempty = "0.11"

# HTTP
bytes = "1"
http = "1"
http-body-util = "0.1"

# Initialization
rayon = "1.7"

# JNI
anyhow = "1"
jni = { version = "0.21", default-features = false }
uuid = "1"
bitflags = "2"
hex = "0.4"

# lightwalletd
tonic = "0.14"

# Logging
log-panics = "2.0.0"
paranoid-android = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"

# Conditional access to newer NDK features
dlopen2 = "0.8"
libc = "0.2"

# Tor
fs-mistrust = "0.12"
tor-rtcompat = "0.35"
rust_decimal = { version = "1", default-features = false, features = ["c-repr"] }
# - The "static" feature is required for the "compression" default feature of arti-client.
xz2 = { version = "0.1", features = ["static"] }

# Shielded voting
#
# `zcash_voting` provides client-side primitives for shielded voting, built on
# Orchard's unstable voting-circuits APIs, so the orchard dependency above
# enables that feature. The Android JNI boundary is `src/main/rust/voting.rs`.
#
# This is taken from git rather than crates.io. The published 0.11 and 1.0
# releases pin the pre-Ironwood librustzcash family, which cargo resolves
# alongside this crate's Ironwood family and duplicates eight Zcash crates in
# the native library (issue #2056). The revision patched in below is 2.0.0-rc.1,
# whose pins match this crate's, so each Zcash crate resolves exactly once.
#
# The version requirement here must keep matching the patched revision's own
# version. A `[patch.crates-io]` entry only applies when it satisfies the
# requirement: if the two drift apart, cargo silently ignores the patch, falls
# back to the crates.io release, and the build still succeeds while linking the
# duplicated pre-Ironwood stack. Cargo reports this only as a warning.
zcash_voting = { version = "2.0.0-rc.1" }

[patch.crates-io]
zcash_voting = { git = "https://github.com/zodl-inc/zcash_voting", rev = "3c9900e56081966b74dd57a0c880c782f4f602bb" }

## Uncomment these to test librustzcash against a git commit
# pczt = { package = "pczt", git = "https://github.com/zcash/librustzcash.git", rev = "REPLACE_ME_GIT_SHA" }
# transparent = { package = "zcash_transparent", git = "https://github.com/zcash/librustzcash.git", rev = "REPLACE_ME_GIT_SHA" }
# zcash_address = { git = "https://github.com/zcash/librustzcash.git", rev = "REPLACE_ME_GIT_SHA" }
# zcash_client_backend = { git = "https://github.com/zcash/librustzcash.git", rev = "REPLACE_ME_GIT_SHA" }
# zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash.git", rev = "REPLACE_ME_GIT_SHA" }
# zcash_keys = { git = "https://github.com/zcash/librustzcash.git", rev = "REPLACE_ME_GIT_SHA" }
# zcash_primitives = { git = "https://github.com/zcash/librustzcash.git", rev = "REPLACE_ME_GIT_SHA" }
# zcash_proofs = { git = "https://github.com/zcash/librustzcash.git", rev = "REPLACE_ME_GIT_SHA" }
# zcash_protocol = { git = "https://github.com/zcash/librustzcash.git", rev = "REPLACE_ME_GIT_SHA" }

[lib]
name = "zcashwalletsdk"
path = "src/main/rust/lib.rs"
crate-type = ["staticlib", "cdylib"]
