[package]
name = "zcash-android-wallet-sdk"
version = "2.8.0-rc.3"
authors = [
    "Jack Grigg <jack@z.cash>",
    "Kevin Gorham <kevin.gorham@z.cash>",
]
description = "JNI backend for the Android wallet SDK"
publish = false
edition = "2024"
rust-version = "1.92"

[features]
# Enables JNI helpers that are only used by Android instrumentation tests.
# This feature must not be enabled for production native builds.
android-test-fixtures = []

# `zcash_voting` is a bare cfg rather than a cargo feature: a feature would have to
# name `dep:zcash_voting`, and that dependency is commented out entirely (see below),
# so there is nothing for a feature to gate. Declaring it here keeps rustc from
# warning that `cfg(zcash_voting)` is an unknown condition.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_voting)'] }

[dependencies]
# Zcash dependencies
orchard = "0.15"
pczt = { version = "0.9.0", features = ["prover", "orchard", "sapling"] }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }
transparent = { package = "zcash_transparent", version = "0.10", default-features = false }
zcash_address = "0.13"
zcash_client_backend = { version = "0.24.0-rc.7", features = [
    "orchard",
    "lightwalletd-tonic-tls-webpki-roots",
    "tor",
    "transparent-inputs",
    "unstable",
    "pczt",
] }
zcash_client_sqlite = { version = "0.22.0-rc.7", features = ["orchard", "transparent-inputs", "unstable", "serde"] }
zcash_note_encryption = "0.4.1"
zcash_primitives = "0.30"
zcash_proofs = "0.30"
zcash_protocol = "0.10"
zcash_script = "0.4"
zip32 = "0.2"
eip681 = "0.1.0"
# Used by voting/notes.rs to construct historical Orchard witness positions, and
# by nothing else -- commented out with the voting module it serves.
# incrementalmerkletree = { version = "0.8", default-features = false }

# Infrastructure
prost = "0.14"
rusqlite = "0.37"
secrecy = "0.8"
rand = "0.8"
nonempty = "0.11"

# HTTP
bytes = "1"
http = "1"
http-body-util = "0.1"

# Initialization
rayon = "1.7"

# JNI
anyhow = "1"
jni = { version = "0.21", default-features = false }
uuid = "1"
bitflags = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# lightwalletd
tonic = "0.14"

# Logging
log-panics = "2.0.0"
paranoid-android = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"

# Conditional access to newer NDK features
dlopen2 = "0.8"
libc = "0.2"

# Tor
fs-mistrust = "0.12"
tor-rtcompat = "0.35"
rust_decimal = { version = "1", default-features = false, features = ["c-repr"] }
# - The "static" feature is required for the "compression" default feature of arti-client.
xz2 = { version = "0.1", features = ["static"] }

# Shielded voting -- DISABLED on the Ironwood (NU6.3) deps, matching
# zcash-swift-wallet-sdk.
#
# `zcash_voting` provides client-side primitives for shielded voting, built on
# Orchard's unstable voting-circuits APIs. It requires orchard 0.14 while this
# crate is on orchard 0.15, so enabling it makes cargo link two incompatible
# copies of the same types. The voting sources (src/main/rust/voting/*) are
# therefore gated behind `cfg(zcash_voting)` and are not built. The Android JNI
# boundary for them is `src/main/rust/voting.rs`.
#
# To re-enable once the voting crates support orchard 0.15: uncomment this
# dependency and `incrementalmerkletree` above, add
# `orchard/unstable-voting-circuits` to the orchard dependency, and build with
# `--cfg zcash_voting`. Default features stay disabled; `client-pir` is needed
# for delegation proof precompute and generation, `client-tree-sync` for vote
# commitment tree sync and VAN witnesses. Expected PIR/tree-sync transitives
# include `pir-client`, `pir-types`, `valar-ypir`, `valar-spiral-rs`,
# `vote-commitment-tree-client`, and `hyper-rustls`.
#
# The share-nullifier entry point forwards to
# `zcash_voting::share_tracking::compute_share_nullifier`:
# https://github.com/valargroup/zcash_voting/blob/zcash_voting-v0.11.0/zcash_voting/src/share_tracking.rs
# The transitive `voting-circuits` dependency contains the share-reveal circuit
# and the Poseidon-based `share_nullifier_hash` implementation:
# https://github.com/valargroup/voting-circuits/blob/v0.8.0/voting-circuits/src/share_reveal/circuit.rs
# zcash_voting = { version = "=0.11.0", default-features = false, features = [
#     "client-pir",
#     "client-tree-sync",
# ] }

[lib]
name = "zcashwalletsdk"
path = "src/main/rust/lib.rs"
crate-type = ["staticlib", "cdylib"]

## Pinned to the librustzcash branch of zcash/librustzcash#2874, which adds the
## `zip318_kind` column this SDK reads. Revert to the crates.io versions once that
## has merged and been released.
[patch.crates-io]
# pczt = { git = "https://github.com/zcash/librustzcash.git", rev = "REPLACE_ME" }
# transparent = { package = "zcash_transparent", git = "https://github.com/zcash/librustzcash.git", rev = "REPLACE_ME" }
# zcash_address = { git = "https://github.com/zcash/librustzcash.git", rev = "REPLACE_ME" }
# zcash_client_backend = { git = "https://github.com/zcash/librustzcash.git", rev = "REPLACE_ME" }
# zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash.git", rev = "REPLACE_ME" }
# zcash_keys = { git = "https://github.com/zcash/librustzcash.git", rev = "REPLACE_ME" }
# zcash_primitives = { git = "https://github.com/zcash/librustzcash.git", rev = "REPLACE_ME" }
# zcash_proofs = { git = "https://github.com/zcash/librustzcash.git", rev = "REPLACE_ME" }
# zcash_protocol = { git = "https://github.com/zcash/librustzcash.git", rev = "REPLACE_ME" }

