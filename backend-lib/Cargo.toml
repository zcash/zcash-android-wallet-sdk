[package]
name = "zcash-android-wallet-sdk"
version = "2.6.5"
authors = [
    "Jack Grigg <jack@z.cash>",
    "Kevin Gorham <kevin.gorham@z.cash>",
]
description = "JNI backend for the Android wallet SDK"
publish = false
edition = "2024"
rust-version = "1.92"

[features]
# chp-voting (the shielded-voting JNI surface) is OFF by default for this testing cycle, even
# though the zcash_voting 1.0 port has landed - re-enable it by adding `chp-voting` to the list
# below. `android-test-fixtures` stays out of default too; it must never be enabled for
# production native builds.
default = []
# Enables JNI helpers that are only used by Android instrumentation tests.
# This feature must not be enabled for production native builds.
android-test-fixtures = []
# Enables the shielded-voting JNI surface (src/main/rust/voting.rs and its
# `Java_..._VotingRustBackend_*` exports) and pulls in the optional `zcash_voting` dependency
# below.
chp-voting = ["dep:zcash_voting", "dep:pasta_curves", "dep:ff"]

[dependencies]
# Zcash dependencies
# Ironwood (NU6.3): tracks the same git rev as [patch.crates-io] below directly, since its
# version (0.15.0) can't satisfy crates-io requirements while pinned to a ZIP 374 branch rev.
orchard = { version = "0.15.0", features = ["unstable-voting-circuits"] }
# Orchard->Ironwood migration engine (core/upstream implementation) — path dependency on the local
# librustzcash checkout (this crate isn't published to crates.io). Replaces the former hand-rolled
# `zcash_pool_migration` crate. The SQLite persistence side (formerly the separate
# `zcash_pool_migration_sqlite` crate) has since been folded into `zcash_client_sqlite::pool_migration`
# (see that dependency's `[patch.crates-io]` entry below) — no separate dependency needed for it.
zcash_pool_migration_backend = { path = "../../../../../librustzcash/zcash_pool_migration_backend", features = ["wallet"] }
pczt = { version = "0.8.0-rc.1", features = ["prover", "orchard", "sapling", "signer"] }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }
# zcash_transparent, zcash_address, zcash_client_backend, zcash_client_sqlite, zcash_primitives,
# zcash_proofs and zcash_protocol are bumped to the minor line the convergence-pin librustzcash
# checkout actually publishes (0.9/0.13/0.24.0-rc.1/0.22.0-rc.1/0.29/0.29/0.10 respectively) so
# the [patch.crates-io] block below is actually used. A `[patch]` only replaces the resolved
# crate when its version satisfies the requirement string declared here; a requirement that's
# only compatible with the *published* generation the patch replaces makes cargo silently
# ignore the patch for that crate and pull a second, unpatched copy from crates.io instead,
# splitting the graph (identical failure mode already hit and documented by slipstream-jni's
# own Cargo.toml for zcash_protocol).
transparent = { package = "zcash_transparent", version = "0.9", default-features = false }
zcash_address = "0.13"
zcash_client_backend = { version = "0.24.0-rc.1", features = [
    "orchard",
    "lightwalletd-tonic-tls-webpki-roots",
    "tor",
    "transparent-inputs",
    "unstable",
    "pczt",
] }
zcash_client_sqlite = { version = "0.22.0-rc.1", features = ["orchard", "transparent-inputs", "unstable", "serde"] }
zcash_note_encryption = "0.4.1"
zcash_primitives = "0.29"
zcash_proofs = "0.29"
zcash_protocol = "0.10"
zcash_script = "0.4"
zip32 = "0.2"
eip681 = "0.1.0"
# Used by migration_finalize.rs to read `ShardTreeError`/`QueryError` variants when checking
# note-witness availability at a migration transaction's anchor boundary.
shardtree = "0.7"
# Used by voting/notes.rs to construct historical Orchard witness positions.
incrementalmerkletree = { version = "0.8", default-features = false }

# Infrastructure
prost = "0.14"
rusqlite = "0.37"
secrecy = "0.8"
rand = "0.8"
nonempty = "0.11"

# HTTP
bytes = "1"
http = "1"
http-body-util = "0.1"

# Initialization
rayon = "1.7"

# JNI
anyhow = "1"
jni = { version = "0.21", default-features = false }
uuid = "1"
bitflags = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# lightwalletd
tonic = "0.14"

# Logging
log-panics = "2.0.0"
paranoid-android = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"

# Conditional access to newer NDK features
dlopen2 = "0.8"
libc = "0.2"

# Tor
fs-mistrust = "0.12"
tor-rtcompat = "0.35"
rust_decimal = { version = "1", default-features = false, features = ["c-repr"] }
# - The "static" feature is required for the "compression" default feature of arti-client.
xz2 = { version = "0.1", features = ["static"] }

# Shielded voting
#
# `zcash_voting` provides client-side primitives for shielded voting. It depends
# on Orchard's unstable voting-circuits APIs, so the direct Orchard dependency is
# pinned to the same version and enables the same feature. Revisit the exact pin
# if the upstream voting crates relax their Orchard requirement.
# The Android JNI boundary for voting code is `src/main/rust/voting.rs`, compiled in only
# behind the `chp-voting` feature (see [features] below). Its share-nullifier entry point
# forwards to `zcash_voting::share::compute_nullifier`:
# https://github.com/valargroup/zcash_voting/blob/zcash_voting-v0.11.0/zcash_voting/src/share_tracking.rs
#
# The transitive `voting-circuits` dependency contains the share-reveal circuit
# and the Poseidon-based `share_nullifier_hash` implementation:
# https://github.com/valargroup/voting-circuits/blob/v0.8.0/voting-circuits/src/share_reveal/circuit.rs
#
# Bumped 0.11.0 -> 1.0.0 for the merged-library build only: 0.11.0's `action.rs` calls
# `pczt::Pczt::parse`/`extract_pczt_sighash` assuming the published pczt 0.7 signatures
# (`&[u8] -> Result<...>`), but the convergence-pin checkout's pczt 0.7.0 (patched in via
# [patch.crates-io] below, required by the slipstream-jni merge) changed those signatures
# without a version bump; 1.0.0 compiles cleanly against it. 1.0.0 also folded every
# previously-optional dependency (pir-client, pir-types, valar-ypir, valar-spiral-rs,
# vote-commitment-tree(-client), voting-circuits) into unconditional deps - it has no `features`
# table at all - so the former `client-pir`/`client-tree-sync` feature list and
# `default-features = false` are dropped; those capabilities are unconditionally compiled in
# now. Optional, gated by `chp-voting`: zcash_voting 1.0's API surface has not yet been fully
# ported past its own rename-level drift, so a default build must not carry it. Revert
# alongside the rest of the patch block once the librustzcash family's next real release lands.
zcash_voting = { version = "=1.0.0", optional = true }
# The delegation-submission signing recipe (voting/delegation.rs) derives the account
# SpendAuth key locally and needs the same Pallas scalar/field types zcash_voting and
# orchard already carry transitively; pin to the versions already resolved for them
# (see Cargo.lock) so this stays the same crate instance, not a second copy.
pasta_curves = { version = "0.5", optional = true }
ff = { version = "0.13", optional = true }

# Slipstream sync engine's JNI binding crate, pulled in as a plain path dependency so its
# `Java_com_zodl_slipstream_*` exports link into THIS cdylib instead of a separate
# libslipstream.so. This is the merged-library shape iOS already has (one libzcashlc, one
# bundled SQLite): backend-lib's own bundled rusqlite and the engine's must be the SAME
# SQLite instance in the SAME process, or closing one connection drops the other's fcntl
# locks out from under it (the dual-instance SIGBUS/disk-I/O hazard; see
# docs/slipstream/android/worklog/ARCHIVE-phases-0-9.md in this repo for the full
# writeup). slipstream-jni builds as rlib + cdylib; Rust keeps `#[no_mangle]` exports from an
# rlib dependency, so depending on it here is sufficient to carry its exports into our cdylib
# (see the `pub use slipstream;` reference in src/main/rust/lib.rs that keeps the linker
# from garbage-collecting it as an unused dependency). The crate is now vendored in-tree
# alongside this manifest; only its own `slipstream-core` dependency still resolves
# cross-repo, into the clean slipstream `main` checkout (see slipstream-jni/Cargo.toml).
slipstream-jni = { path = "slipstream-jni" }

# Keystone hardware-wallet batch signing for the Orchard migration flow.
#
# The compiled `keystone-sdk-android` AAR this project's Kotlin layer otherwise depends on
# (co.electriccoin.zcash ui-lib) is stale (last release Oct 2025) and has no batch-signing API —
# only single-PCZT `generatePczt`/`parsePczt`. Batch signing for Zcash (firmware + these UR
# envelope types) was added to the Keystone ecosystem within the last month, but hasn't reached a
# new Android SDK release yet. `chainapsis/vizor-wallet` (a different Zcash wallet, run by the
# same contributors behind the Keystone firmware/core PRs) bypasses the compiled AAR entirely by
# depending on `keystone-sdk-rust`'s `ur-registry` crate and `ur-rs` directly from git — this
# mirrors that exact, verified-working pattern instead of waiting on an Android SDK release.
# The actual batching primitive is `pczt::roles::signer::batch` (see the `signer` feature above),
# not Keystone-specific; these crates only provide the outer UR/QR envelope.
ur = { git = "https://github.com/KeystoneHQ/ur-rs", tag = "0.3.3" }
ur-registry = { git = "https://github.com/KeystoneHQ/keystone-sdk-rust", package = "ur-registry", default-features = false, features = ["std"] }

## Local librustzcash checkout, on main-latest (tracks upstream origin/main directly — as of
## 2026-07-22 this has absorbed Danny/core team's former feat/pool-migration-sqlite stack (PR
## #2669), account-keying the pool-migration store (PR #2712 + FK fixup #2720), and proving the
## transfer at schedule time plus anchor-retention/proving-key-cache follow-ups (PR #2710 +
## #2728/#2729/#2730/#2734)) — needed for zcash_pool_migration_backend above and
## zcash_client_sqlite::pool_migration below. orchard is patched to the exact rev main pins
## (0.15.0 isn't on crates.io yet with ZIP 374 support), everything else is a local path for fast
## iteration.
##
## The pool-migration store is now scoped per-account (`PoolMigrations::for_account`, see
## `migration_engine.rs`'s `Backend::new`) — the former singleton-per-pool cross-account collision
## (see `project_core_migration_swap` notes) is resolved by this pull, not just documented.
## `zcash_pool_migration_backend::engine::MigrationProver` (prove_transfer/prove_preparation) has
## since been adopted (migration.rs), retiring the former `migration_finalize.rs` hand-rolled
## proving stopgap. `#2716` (note locking) has also been adopted: `InputSource` selection methods
## and `propose_transfer`/`propose_shielding` now take a `LockFilter<'_>` /
## `Option<TxVersion>`/`Option<LockRequest>` — see lib.rs and migration_engine.rs.
##
## IMPORTANT: as of this pull, this repo's code now references librustzcash main APIs
## (LockFilter, TxVersion, LockRequest — PR #2716 + 41 follow-up commits) beyond what the
## convergence-pin checkout at 68603fa71a provides. The local librustzcash checkout needs to be
## advanced to pick up #2716 before this crate will compile again.
[patch.crates-io]
zcash_client_backend = { path = "../../../../../librustzcash/zcash_client_backend" }
zcash_client_sqlite = { path = "../../../../../librustzcash/zcash_client_sqlite" }
zcash_keys = { path = "../../../../../librustzcash/zcash_keys" }
zcash_primitives = { path = "../../../../../librustzcash/zcash_primitives" }
zcash_proofs = { path = "../../../../../librustzcash/zcash_proofs" }
zcash_protocol = { path = "../../../../../librustzcash/components/zcash_protocol" }
zcash_address = { path = "../../../../../librustzcash/components/zcash_address" }
zcash_encoding = { path = "../../../../../librustzcash/components/zcash_encoding" }
zcash_transparent = { path = "../../../../../librustzcash/zcash_transparent" }
zip321 = { path = "../../../../../librustzcash/components/zip321" }
pczt = { path = "../../../../../librustzcash/pczt" }
equihash = { path = "../../../../../librustzcash/components/equihash" }
zcash_voting = { path = "../../../../../zcash_voting/zcash_voting" }
orchard = { git = "https://github.com/zcash/orchard.git", rev = "3bd2b736d1273226595773265313fc3f3428af16" }

## Uncomment this to test someone else's librustzcash changes in a branch
#[patch.crates-io]
#pczt = { git = "https://github.com/zcash/librustzcash.git", branch = "main" }
#transparent = { package = "zcash_transparent", git = "https://github.com/zcash/librustzcash", branch = "main" }
#zcash_address = { git = "https://github.com/zcash/librustzcash", branch = "main" }
#zcash_client_backend = { git = "https://github.com/zcash/librustzcash", branch = "main" }
#zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash", branch = "main" }
#zcash_primitives = { git = "https://github.com/zcash/librustzcash", branch = "main" }
#zcash_proofs = { git = "https://github.com/zcash/librustzcash", branch = "main" }
#zcash_protocol = { git = "https://github.com/zcash/librustzcash", branch = "main" }

[dev-dependencies]
# Test-only: converts a BIP-39 mnemonic phrase to seed bytes for `migration::live_wallet_tests`,
# which needs a real UnifiedSpendingKey to exercise the in-process-signing path
# (`commit_preparation`) against a real wallet DB fixture — the app itself never uses this crate
# (Kotlin does the mnemonic-to-seed conversion, Rust always receives already-derived seed bytes).
bip0039 = "0.12"

[lib]
name = "zcashwalletsdk"
path = "src/main/rust/lib.rs"
crate-type = ["staticlib", "cdylib"]

# slipstream-jni is deliberately its own one-crate Cargo workspace (own [workspace] table);
# Cargo auto-adopts path deps inside this directory as workspace members, which collides
# with that nested root. Excluding it keeps it a plain out-of-workspace path dependency
# (nested-workspace workaround, rust-lang/cargo#5042).
[workspace]
exclude = ["slipstream-jni"]
