# slipstream-jni — the Android JNI binding for the Slipstream Zcash sync engine.
#
# This crate is the Rust half of the `com.zodl.slipstream:slipstream-android` AAR. It
# compiles to `libslipstream.so` (one per ABI) and exports the JNI symbols
# `Java_com_zodl_slipstream_SlipstreamNative_*`, binding the Slipstream C ABI
# (engine `HOSTING.md` §4) function-for-function over `slipstream_core::ffi_handle`.
#
# The detailed normative binding spec is the JNI binding contract shipped with each artifact
# release; the behavioral contract is the engine's `HOSTING.md`.
#
# HONESTY: nothing in this crate has been compiled with an Android toolchain, and it has
# never been built via cargo-ndk. Every JNI descriptor string is hand-derived, not
# `javap`-verified. See README.md "Status".

[package]
name = "slipstream-jni"
version = "0.6.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false
description = "JNI binding of the Slipstream Zcash sync engine (C ABI v0.6.0) for Android"

# ── OWN workspace root ────────────────────────────────────────────────────────────────
# This empty table makes `slipstream-jni` its OWN one-crate Cargo workspace; it MUST NOT
# join the monorepo workspace that hosts the engine crates (slipstream/core, slipstream/cli,
# … — that workspace does NOT list this crate as a member). Keeping it separate is
# deliberate: the AAR ships from the engine repo on its own release train.
#
# Consequence you MUST understand (see the [patch.crates-io] block below): because this is a
# distinct workspace root, the engine root's [patch.crates-io] does NOT apply transitively to
# this build — it has to be re-declared here.
[workspace]
resolver = "3"

[lib]
# cdylib → libslipstream.so (the JNI target). rlib → lets Rust unit tests / a future Rust
# consumer link the crate directly.
name = "slipstream"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The engine. This crate is now vendored in the SDK repo at backend-lib/slipstream-jni/, so
# the path dep crosses repo boundaries into the clean slipstream `main` checkout's `core/`
# under the shared ~/Developer/zcash/ root. `core`'s own `workspace = true` deps resolve
# against ITS workspace root — the slipstream repo root Cargo.toml — independently of this
# crate's workspace, so `core` links the exact same librustzcash the slipstream repo build does.
slipstream-core = { path = "../../../../../../slipstream/core" }

# JNI. default-features = false drops the `invocation` feature (launching a JVM) — we are
# loaded INTO a JVM, never the reverse. Matches the JNI binding contract §3.0.
jni = { version = "0.21", default-features = false }

# Async runtime for the handle's owned engine runtime. Features per engine HOSTING.md §3.1
# (the published v0.6.0 host recipe): rt-multi-thread + macros + sync + time.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

tracing = "0.1"
# Subscriber for initOnLoad. env-filter builds the level filter (fmt/registry are default
# features). On Android the events are re-routed to logcat (see the android target block).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# TreeState protobuf encoding in restoreAnchor (Message::encode_to_vec).
prost = "0.14"
# readQuery row encoding (src/read_query.rs). Already resolved in the graph transitively
# (zcash_client_backend's "serde" feature family, arti-client) — this just makes the type
# paths nameable from this crate; no new dependency actually enters the build.
serde_json = "1"

# ── librustzcash family: direct deps for the wallet-summary walk (src/summary.rs) ───────
# These types (WalletDb, WalletSummary, AccountBalance, ConfirmationsPolicy, ZatBalance)
# are ALREADY inside libslipstream.so via slipstream-core; declaring them here only makes
# the type paths nameable from this crate. The versions are NON-pinned (no `=`) and MUST
# equal slipstream-core's, so Cargo unifies them with core's copies — the engine's graph
# governs the exact patch level, never this crate. zcash_client_sqlite 0.21 and
# zcash_client_backend 0.23 are unaffected by the 2026-07-16 patch resolution (their
# semver-compatible with the pool-migration-local sibling's own 0.21.1/0.23.0). zcash_protocol
# moved from the published 0.9 line to 0.10, matching the engine root's `=0.10.0` pin — a bare
# "0.9" requirement here does not semver-match the patched 0.10.0 crate, so Cargo would (and
# did) fall back to a second, unpatched 0.9.0 copy from the registry, splitting the graph.
zcash_client_backend = { version = "=0.24.0-rc.1", features = ["orchard", "transparent-inputs", "unstable"] }
zcash_client_sqlite = { version = "=0.22.0-rc.1", features = ["orchard", "transparent-inputs", "unstable", "serde"] }
zcash_protocol = "0.10"
rusqlite = "0.37"
rand = "0.8"

# ── Android-only logging backend ────────────────────────────────────────────────────────
# The engine emits `tracing` events/spans (NOT the `log` facade), so the right adapter is
# a tracing_subscriber Layer that writes to the Android log buffer — hence `tracing-android`
# rather than `android_logger` (which is a `log`-facade backend and would need a bridge).
# The upstream backend-lib uses the maintained `paranoid_android` equivalent; swapping to
# it is a one-line change. This dep is gated to Android, so the host `cargo check` the
# orchestrator runs never compiles it.
[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"

[profile.release]
lto = true
strip = true
opt-level = 3

# ════════════════════════════════════════════════════════════════════════════════════════
# [patch.crates-io] — mirrors the engine root's librustzcash-family patch set verbatim
# ════════════════════════════════════════════════════════════════════════════════════════
# `slipstream-core = { path = "../../../../../../slipstream/core" }` resolves core's
# `workspace = true` deps against the engine root's `[workspace.dependencies]` regardless of
# which workspace is doing the building (core is a member of that root workspace, not of this
# one) — see the comment on the `slipstream-core` dependency above. Because a `[patch]` only
# applies from the workspace root being built, the engine root's `[patch.crates-io]` does not
# apply here transitively and must be re-declared — this is a re-declaration, not a divergent
# choice.
#
# This block, backend-lib's own `[patch.crates-io]` (one directory up), and the engine root's
# `[patch.crates-io]` (~/Developer/zcash/slipstream/Cargo.toml) must all name the exact same
# librustzcash rev and the exact same orchard rev — see `../check-librustzcash-pin.sh`, which
# fails if this file and backend-lib's disagree on either rev, or if a `path = "…librustzcash`
# patch has crept back into either, and warns (non-fatal) if the sibling engine checkout's rev
# has drifted from this one. Whenever the engine root's `[patch.crates-io]` changes, mirror the
# change here (and in backend-lib's own block) in the same commit — a drift is a silent
# wrong-source build.
#
# Consequence: this crate never builds against a plain crates.io release of any patched crate —
# the direct-dep version strings above (`zcash_client_backend`/`zcash_client_sqlite` etc.) are
# only a minimum-version hint; the patch below always wins.
# ════════════════════════════════════════════════════════════════════════════════════════
[patch.crates-io]
zcash_client_backend = { git = "https://github.com/zcash/librustzcash", rev = "4b4e2633b28c2f18fdc42c741ad7c6d9f67ec6e5" }
zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash", rev = "4b4e2633b28c2f18fdc42c741ad7c6d9f67ec6e5" }
zcash_keys = { git = "https://github.com/zcash/librustzcash", rev = "4b4e2633b28c2f18fdc42c741ad7c6d9f67ec6e5" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "4b4e2633b28c2f18fdc42c741ad7c6d9f67ec6e5" }
zcash_proofs = { git = "https://github.com/zcash/librustzcash", rev = "4b4e2633b28c2f18fdc42c741ad7c6d9f67ec6e5" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "4b4e2633b28c2f18fdc42c741ad7c6d9f67ec6e5" }
zcash_address = { git = "https://github.com/zcash/librustzcash", rev = "4b4e2633b28c2f18fdc42c741ad7c6d9f67ec6e5" }
zcash_encoding = { git = "https://github.com/zcash/librustzcash", rev = "4b4e2633b28c2f18fdc42c741ad7c6d9f67ec6e5" }
zcash_transparent = { git = "https://github.com/zcash/librustzcash", rev = "4b4e2633b28c2f18fdc42c741ad7c6d9f67ec6e5" }
zip321 = { git = "https://github.com/zcash/librustzcash", rev = "4b4e2633b28c2f18fdc42c741ad7c6d9f67ec6e5" }
pczt = { git = "https://github.com/zcash/librustzcash", rev = "4b4e2633b28c2f18fdc42c741ad7c6d9f67ec6e5" }
equihash = { git = "https://github.com/zcash/librustzcash", rev = "4b4e2633b28c2f18fdc42c741ad7c6d9f67ec6e5" }
orchard = { git = "https://github.com/zcash/orchard.git", rev = "3bd2b736d1273226595773265313fc3f3428af16" }
