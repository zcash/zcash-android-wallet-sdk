# slipstream-jni is its own Cargo workspace root (see Cargo.toml's `[workspace]` table), so
# rustup's directory-based toolchain override does not inherit ../../../android/rust-toolchain.toml
# (a sibling tree, not an ancestor of this directory) or any toolchain file from the engine's
# own monorepo root (neither exists there either). Pin explicitly here so `cargo`/`rustc` —
# whether invoked directly or by the rust-android-gradle plugin's cargoBuild tasks — always
# resolves to a toolchain new enough for edition = "2024" (stabilized after 1.84), matching the
# vendored Android SDK's own pin for build consistency across the two Gradle-driven Rust builds.
[toolchain]
channel = "1.92.0"
targets = [
    "armv7-linux-androideabi",
    "aarch64-linux-android",
    "i686-linux-android",
    "x86_64-linux-android",
]
